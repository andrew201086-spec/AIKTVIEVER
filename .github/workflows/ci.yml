name: Проверка и публикация

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Publishing to Pages needs these; nothing else in the workflow writes.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an in-flight run, but a deploy is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Линтер, типы, тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Типы
        run: npx tsc --noEmit

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npx vite build

      - name: Уязвимости в зависимостях приложения
        # Reported, not enforced: the remaining advisories are transitive
        # through Cornerstone 1.x and clear with the upgrade to 3.x.
        run: npm audit --omit=dev || true

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    name: Публикация на GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
